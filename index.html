<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>PULV MALIN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">PULV <span>MALIN</span></div>
  <div class="subtitle">Réglage intelligent de pulvérisateur</div>
</header>

<main class="container">

<section id="home" class="active">
  <h2>Machine</h2>
  <input id="machineName" placeholder="Nom de la machine">
  <button onclick="saveMachine()">Enregistrer</button>
  <button class="secondary" onclick="showSection('settings')">Commencer</button>
</section>

<section id="settings">
  <h2>Modèle de répartition</h2>

  <select id="modeleRepartition" onchange="showSchema(this.value)">
    <option value="">Choisir…</option>
    <option value="3r_sans">3 rangs – sans retour</option>
    <option value="3r_avec">3 rangs – avec retour</option>
    <option value="4r_sans">4 rangs – sans retour</option>
    <option value="4r_avec">4 rangs – avec retour</option>
  </select>

  <button class="secondary" onclick="showSection('tangentiel')">
    2 rangs – Tangentiel / Aéro
  </button>

  <div id="schemaContainer"></div>

  <h2>Paramètres</h2>
  <input id="dose" type="number" placeholder="Dose (L/ha)">
  <input id="interligne" type="number" step="0.01" placeholder="Interligne (m)">
  <input id="vitesse" type="number" step="0.1" placeholder="Vitesse (km/h)">

  <button onclick="calculateOutputs()">Calculer</button>
</section>

<section id="tangentiel">
  <h2>2 rangs – Tangentiel / Aéro</h2>
  <input id="nbBusesTangentiel" type="number" min="1" value="4">
  <button onclick="createTangentielModel()">Créer le modèle</button>
  <button class="secondary" onclick="showSection('settings')">Retour</button>
</section>

<section id="result">
  <h2>Résultats</h2>

  <table id="resultTable">
    <thead>
      <tr>
        <th>#</th><th>Sortie</th><th>Coef</th>
        <th>Débit cible</th><th>Pastille</th><th>Débit 3 bar</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button onclick="exportPDF()">Exporter PDF</button>
  <button class="secondary" onclick="showSection('settings')">Retour</button>
</section>

</main>

<!-- Loader PDF -->
<div id="pdfLoader" class="pdf-loader hidden">
  <div class="spinner"></div>
  <div>Génération du PDF…</div>
</div>

<!-- Zone PDF cachée -->
<div id="pdfLayout" style="display:none">
  <div id="pdfPulve"></div>
  <div id="pdfResume"></div>
</div>

<script src="app.js"></script>
</body>
</html>
